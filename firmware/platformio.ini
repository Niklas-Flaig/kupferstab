; Kupferstab firmware for the Wemos D1 mini (ESP8266, 4 MB flash).
; Flash layout 4m2m: ~1 MB sketch, ~1 MB OTA buffer, 2 MB LittleFS for the app.

[platformio]
default_envs = d1_mini

[env]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -DFW_VERSION=\"0.1.0\"
  -DATOMIC_FS_UPDATE
lib_deps =
  esp32async/ESPAsyncTCP@2.0.0
  esp32async/ESPAsyncWebServer@3.12.1
  bblanchon/ArduinoJson@7.3.2
  adafruit/Adafruit NeoPixel@1.15.5

; First flash over USB: pio run -e d1_mini -t upload && pio run -e d1_mini -t uploadfs
[env:d1_mini]

; Later updates from a laptop on the same Wi-Fi (the staff's own or your home network):
; pio run -e ota -t upload --upload-port 192.168.4.1
[env:ota]
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
  --auth=kupferstab
